# Start:            docker compose up -d --build
# Scale to N:       docker compose up -d --scale api=N && docker compose restart nginx
services:
  api:
    build: .
    image: digit-classifier-api
    volumes:
      - ./data:/app/data        
      - ./models:/app/models   
    environment:
      - RETRAIN_THRESHOLD=50
      - AUTO_RETRAIN=true
    deploy:
      resources:
        limits:
          cpus: "1.0"           
          memory: 2g
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped